<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · Blog{% endif %}</title>
  {% if page.description %}<meta name="description" content="{{ page.description | strip_html | escape }}">{% endif %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#1E8BCB',light:'#4FB6E0',dark:'#0E2951'}}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  {% feed_meta %}
  <style>
    body { font-family: 'Urbanist', sans-serif; background-color: #0A1B30; color: #ffffff; }
    .card { background: rgba(255,255,255,.04); }
    .post-content { color:#cbd5e1; font-size:1.075rem; line-height:1.75; }
    .post-content h2 { color:#fff; font-size:1.6rem; font-weight:800; margin:2rem 0 .75rem; letter-spacing:-.01em; }
    .post-content h3 { color:#fff; font-size:1.25rem; font-weight:700; margin:1.5rem 0 .5rem; }
    .post-content p { margin:0 0 1.1rem; }
    .post-content a { color:#4FB6E0; text-decoration:underline; }
    .post-content ul,.post-content ol { margin:0 0 1.1rem 1.25rem; }
    .post-content ul { list-style:disc; } .post-content ol { list-style:decimal; }
    .post-content li { margin:.35rem 0; }
    .post-content blockquote { border-left:3px solid #1E8BCB; background:rgba(255,255,255,.04); padding:.75rem 1rem; margin:1.25rem 0; color:#e2e8f0; border-radius:0 .5rem .5rem 0; }
    .post-content code { background:rgba(255,255,255,.08); padding:.15rem .4rem; border-radius:.3rem; font-size:.9em; }
    .post-content pre { background:#0b1220; padding:1rem; border-radius:.6rem; overflow-x:auto; margin:1.25rem 0; border:1px solid rgba(255,255,255,.08); }
    .post-content pre code { background:none; padding:0; }
    .post-content img { border-radius:.6rem; margin:1.25rem 0; max-width:100%; }
  </style>
</head>
<body class="p-6 md:p-8 min-h-screen flex flex-col">
  <div class="max-w-3xl mx-auto w-full flex-grow">
    <nav class="flex items-center justify-between mb-12 mt-2">
      <a href="/" class="inline-flex items-center" aria-label="EntityAndSearch home"><span class="bg-white rounded-xl px-3 py-2 md:px-4 md:py-3 inline-flex"><img src="/logo-entityandsearch.png" alt="EntityAndSearch" class="h-12 md:h-16 block"></span></a>
      <div class="hidden sm:flex gap-5 text-sm text-gray-400 whitespace-nowrap items-center">
        <a href="/for-agencies/" class="hover:text-brand transition-colors">For Agencies</a>
        <a href="/blog/" class="hover:text-brand transition-colors">Blog</a>
      </div>
    </nav>
    {{ content }}
  </div>
  <footer class="max-w-3xl mx-auto w-full border-t border-gray-800 py-8 mt-16 flex flex-col sm:flex-row justify-between items-center text-xs text-gray-500">
    <p>© 2026 Randy Holland · EntityAndSearch</p>
    <div class="flex gap-4 mt-4 sm:mt-0">
      <a href="/" class="hover:text-brand transition-colors">Home</a><span class="text-gray-700">|</span>
      <a href="/blog/feed.xml" class="hover:text-brand transition-colors">RSS</a><span class="text-gray-700">|</span>
      <a href="https://www.linkedin.com/in/webrandyholland/" target="_blank" rel="noopener" class="hover:text-brand transition-colors">LinkedIn</a>
    </div>
  </footer>
</body>
</html>
